[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dt4acc"
version = "2.0.0-alpha"
description = "digital twin for accelerators"
authors = [
  { name = "Waheedullah Sulaiman Khail" },
  { name = "Pierre Schnizer" },
  { name = "Guillaume Pichon" }
]
license = { text = "GPL-3.0" }
requires-python = ">=3.7"
keywords = []
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License (GPL)",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "dt4acc-lib>=2.0.0a0",
    # for BESSY II
    # actually required by custom bessyii
    # currently bessyii load managers used by
    # soleil too...
    # these depend on yaml
    "pyaml",
    "pydantic",
]

# Todo: fix that I don't need to give a specific path

[project.urls]
Homepage = "https://github.com/dt4acc/dt4acc"
Documentation = "https://github.com/dt4acc/dt4acc"
Repository = "https://github.com/dt4acc/dt4acc.git"

[project.optional-dependencies]
docs = [
  "Sphinx",
  "sphinx-rtd-theme",
  "sphinxcontrib-napoleon",
  "furo",
  "myst-parser",
  "sphinx-autodoc-typehints>=2.0",
  "sphinx-copybutton",
  "sphinx-design",
  "sphinxcontrib-bibtex",
  "numpydoc",
]

epics = [
     "softioc>4.1",
     "p4p"
]

tango = [
     "pytango!=10.1.*"
]

bessyii = [
    "lat2db"
]
test = [
    "pytest",
    "pytest-asyncio"
]
[project.scripts]
dt4acc_bessyii = "dt4acc.custom_facility.bessyii.run_bessyii_twin:run"
dt4acc_bessytl = "dt4acc.custom_facility.bessytl.run_bessytl_twin:run"
dt4acc_bessyii_injection = "dt4acc.custom_facility.bessyii_injection.run_bessyii_injection_twin:run"
dt4acc_soleil = "dt4acc.custom_facility.soleil.run_soleil_twin:main"
dt4acc_maxiv = "dt4acc.custom_facility.maxiv.run_maxiv_twin:main"
dt4acc_maxiv_r1 = "dt4acc.custom_facility.maxiv_r1.run_maxiv_r1_twin:main"
dt4acc_maxiv_r1_register = "dt4acc.custom_facility.maxiv_r1.register_devices:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dt4acc"]

[tool.hatch.build]
dev-mode-dirs = ["src"]
